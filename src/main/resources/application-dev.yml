spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# 先在目标库执行 schema.sql；当前采集链路尚未生成历史批次。
cleaning:
  history:
    persistence-enabled: false
    persistence-interval-ms: 2000
