# 最新PLC点位配置：系统 → 1～4号绞机 → 故障明细 → 远程写入。
# 中文说明全部使用YAML注释，不增加description/name等字段，不进入Java对象或采集数据。
# 模板不自动加载；现场main默认读取field-config/plc.yml。
# symbol是PLC标签；address才是Modbus零基协议地址，两者不可未经确认直接等同。
# 信捷文档D500地址500仅作D区映射参考；M区映射需现场确认，所有address暂留null。
# enabled=false的点不会读取；确认地址、类型、字序、单位及业务归属后逐项启用。
# data-type/byte-order为null表示尚未确认；不能只打开enabled就连接现场。
# D0～D1字序测试：已知1234567890=0x499602D2，高字18838、低字722；本工具只读不写测试值。
# 类型可选BOOLEAN/INT16/UINT16/INT32/UINT32/FLOAT32/FLOAT64，字序可选ABCD/BADC/CDAB/DCBA。
# 当前网络解码为value=raw×scale+offset；BOOLEAN按位读取，active-value只解释有效极性。
# 八路拉力kg=(raw-10)×0.001×101.9716；电机等效拉力kg=raw×0.35×163.0883/(9.80665×0.16)。
# 同机两索合力为两路拉力之和，系统总力为八路同批之和；电机等效力单独保留。
# 编码器原码不是高度：r=(count-bottom)/8192；每台bottom必须现场分别实测。
# r≤12时h=r×1.043；12<r≤24时h=12.516+(r-12)×1.1069；r>24时h=25.7988+(r-24)×1.171，h单位m。
# 速度按同一连续运行段的高度差/轴计时差×60计算，单位m/min；不再使用旧D61～D65速度点。
# 没有独立圆环高度点，不配置ringHeight，也不把四机平均高度冒充圆环真实高度。
# 已接入D201/独立方向/编码器分段高度/轴计时速度；M106为正式整轮边界。
# 正式依据：docs/plc-realtime-point-review-20261025.md、docs/plc-data-omissions-20261025.md。
cleaning:
  plc:
    enabled: true
    worker-interval-ms: 50
    queue-capacity: 256
    devices:
      - id: ""                  # 本地通信设备编号
        enabled: true
        writes-enabled: false
        host: ""                # 直接填写现场PLC的局域网IP
        port: 502
        unit-id: 1              # 用户已确认站号为1
        poll-interval-ms: 500
        timeout-ms: 1000
        # 信捷《Modbus TCP 报文格式解析》第1页：寄存器单次读写最多120个。
        max-read-registers: 120
        max-write-registers: 120
        configuration-version: null  # 实际参数版本，不能按进程重启时间生成
        encoder-bottom-counts: {}     # 实测后填写，例如1:计数、2:计数；不能把未知底部写成0
        height-min: null              # 四机统一最低高度，单位m
        height-max: null              # 四机统一最高高度，单位m
        points:
          # M106上升沿开始整轮、下降沿结束；M60/M61在轮内锁存，结束批先读异常位再结算。
          # 这些点位未确认M区Modbus地址，默认关闭。D10/M204不作为历史边界。
          - {id: automaticCycleActive-1, symbol: M106, field: automaticCycleActive, index: 1, enabled: false, address: null, function-code: 1, data-type: BOOLEAN, byte-order: ABCD, scale: 1, offset: 0, active-value: 1, unit: ""}
          - {id: cycleAbnormal-1, symbol: M60, field: cycleAbnormal, index: 1, enabled: false, address: null, function-code: 1, data-type: BOOLEAN, byte-order: ABCD, scale: 1, offset: 0, active-value: 1, unit: ""}
          - {id: cycleAbnormalEnd-1, symbol: M61, field: cycleAbnormalEnd, index: 1, enabled: false, address: null, function-code: 1, data-type: BOOLEAN, byte-order: ABCD, scale: 1, offset: 0, active-value: 1, unit: ""}
          # PLC累计数只用于显示；原值类型/字序/地址确认后启用。
          - {id: downwardCompletedCount-1, symbol: D11, field: downwardCompletedCount, index: 1, enabled: false, address: null, function-code: 3, data-type: null, byte-order: null, scale: 1, offset: 0, unit: ""}
          - {id: upwardFaultCount-1, symbol: D12, field: upwardFaultCount, index: 1, enabled: false, address: null, function-code: 3, data-type: null, byte-order: null, scale: 1, offset: 0, unit: ""}
          - {id: downwardFaultCount-1, symbol: D13, field: downwardFaultCount, index: 1, enabled: false, address: null, function-code: 3, data-type: null, byte-order: null, scale: 1, offset: 0, unit: ""}
          # ==================== 一、系统状态与运行事实 ====================
          # 系统状态：D201，1运行、2待机、3检修、4故障。
          # 保留PLC状态码；通信在线由TCP连接提供，不从状态码猜测。
          - id: "systemState-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D201"  # PLC标签，不代替协议地址
            field: "systemState"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: null  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "code"  # PLC原值单位标记
          # 系统自动运行方向/上下文原码：D202。
          # 仅确认自动模式相关语义，完整枚举待确认；四台方向分别读取M120～M127。
          - id: "systemDirectionRaw-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D202"  # PLC标签，不代替协议地址
            field: "systemDirectionRaw"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: null  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "code"  # PLC原值单位标记
          # 系统总故障位：M3，1有故障、0未激活；此极性已经确认。
          - id: "fault-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "M3"  # PLC标签，不代替协议地址
            field: "fault"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 1  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: "BOOLEAN"  # 实际PLC存储类型，null项需确认后填写
            byte-order: "ABCD"  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "bool"  # PLC原值单位标记
          # 系统故障码：D3，保留PLC原始故障分类。
          # 10～13电机1～4使能故障，15～18电机1～4运行故障，20～27拉力1～8异常，
          # 28～35传感器1～8故障，40～43编码器1～4异常；保持/清零及并发语义待确认。
          - id: "faultCode-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D3"  # PLC标签，不代替协议地址
            field: "faultCode"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: null  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "code"  # PLC原值单位标记
          # PLC完整上行完成次数：D10。
          # 不是今日次数或本次进程次数；位宽、断电保持、清零/回卷规则待确认。
          - id: "upwardCompletedCount-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D10"  # PLC标签，不代替协议地址
            field: "upwardCompletedCount"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: null  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: "count"  # value输出单位；空字符串表示无单位
            raw-unit: "count"  # PLC原值单位标记
          # 本次自动运行计时原码：D16～D17，已知为32位。
          # 停止/中断后重新计时；确认INT32/UINT32、时间单位和字序后启用，不当累计工时。
          - id: "automaticRunTimeRaw-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D16"  # PLC标签，不代替协议地址
            field: "automaticRunTimeRaw"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: null  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "raw"  # PLC原值单位标记
          # 自动往返一轮完成：M204，上去再下来算一轮。
          # 不是单独上行结束；保持/脉冲及清零规则待确认，不能每读到一次1就新增一轮。
          - id: "cycleCompleted-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "M204"  # PLC标签，不代替协议地址
            field: "cycleCompleted"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 1  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: "BOOLEAN"  # 实际PLC存储类型，null项需确认后填写
            byte-order: "ABCD"  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "bool"  # PLC原值单位标记
          # 32位字序现场验证：D0～D1。
          # PLC人员准备已知值1234567890后读取，实测ABCD/CDAB等字序；本点不是生产测量。
          - id: "wordOrderProbe-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D0"  # PLC标签，不代替协议地址
            field: "wordOrderProbe"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: "INT32"  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "count"  # PLC原值单位标记

          # ==================== 二-1、1号绞机及两路传感器 ====================
          # 1号绞机状态：D203，0待机、1运行、2故障。
          - id: "winchState-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D203"  # PLC标签，不代替协议地址
            field: "winchState"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: null  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "code"  # PLC原值单位标记
            winch-id: ""  # 填写该号绞机的实际内部编号，同机各点必须一致
          # 1号绞机上行指示：M120，1表示上行指示激活。
          # 与本机下行位配对：1/0上行，0/1下行，0/0无方向指示，1/1冲突；不单凭0/0认定机械已停止。
          - id: "winchUp-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "M120"  # PLC标签，不代替协议地址
            field: "winchUp"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 1  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: "BOOLEAN"  # 实际PLC存储类型，null项需确认后填写
            byte-order: "ABCD"  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "bool"  # PLC原值单位标记
            winch-id: ""  # 填写该号绞机的实际内部编号，同机各点必须一致
          # 1号绞机下行指示：M121，1表示下行指示激活。
          - id: "winchDown-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "M121"  # PLC标签，不代替协议地址
            field: "winchDown"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 1  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: "BOOLEAN"  # 实际PLC存储类型，null项需确认后填写
            byte-order: "ABCD"  # 32位先通过D0/D1实测；null项需确认后填写
            scale: 1  # 换算比例，不能重复换算
            offset: 0  # 换算偏移
            active-value: 1  # 位信号值等于此值时视为激活
            invalid-value: null  # 仅填写PLC明确约定的无效码
            unit: ""  # value输出单位；空字符串表示无单位
            raw-unit: "bool"  # PLC原值单位标记
            winch-id: ""  # 填写该号绞机的实际内部编号，同机各点必须一致
          # 1号绞机编码器原始计数：D53～D54，DINT有符号32位。
          # 该值不是米；按文件顶部的分层公式和本机实测底部值换算高度，不能继续使用旧D80～D83高度点。
          - id: "encoderCount-1"  # 点位唯一编号，采集文件按此编号区分来源
            symbol: "D53"  # PLC标签，不代替协议地址
            field: "encoderCount"  # 采集字段标识，不是中文说明
            index: 1  # 系统点为1；本机点为1～4；索拉力为1～8
            enabled: false  # 核对下列接入配置后再改为true
            address: null  # 待填写实际Modbus零基地址
            function-code: 3  # 1=读线圈，3=读保持寄存器；以PLC映射为准
            data-type: "INT32"  # 实际PLC存储类型，null项需确认后填写
            byte-order: null  # 32位先通过D0/D1实测；null项需确认后填写
